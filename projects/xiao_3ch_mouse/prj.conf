# ---------------------------------------------------------------
# 3-channel BLE mouse (Logitech MX Master style profile switching)
# Board target: xiao_ble  (Seeed XIAO nRF52840)
#   若是 Sense 版本改用: xiao_ble/nrf52840/sense
# ---------------------------------------------------------------

CONFIG_GPIO=y

# --- Bluetooth core ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO-3CH-Mouse"

# 3 個獨立身分(identity)= 3 個頻道，各自獨立的位址與 bonding table
CONFIG_BT_ID_MAX=3
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=3

# --- 安全性 / 配對 ---
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
# 除錯用，正式量產前可關閉:
# CONFIG_BT_LOG_LEVEL_DBG=y

# --- 持久化儲存 (identity + bonding key 存 flash，重開機不遺失) ---
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# --- HID over GATT (滑鼠 report) ---

CONFIG_BT_DIS=y

# --- Log ---
CONFIG_LOG=y
CONFIG_PRINTK=y
