# ==========================================
# 系統與硬體基礎設定
# ==========================================
CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ENTROPY_GENERATOR=y

# ==========================================
# 🚨 封殺隱形內鬼：關閉預設 USB 終端機與自動啟動
# ==========================================
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USB_CDC_ACM=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# ==========================================
# nRF52840 時脈與硬體支援 (解決 121 錯誤)
# ==========================================
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y

# ==========================================
# USB 虛擬網卡設定 (Zephyr 4.4.1 新架構)
# ==========================================
CONFIG_UDC_DRIVER=y
CONFIG_USB_DEVICE_STACK_NEXT=y

# ==========================================
# 網路核心與協定設定 (純 IPv4)
# ==========================================
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n

# ==========================================
# 傳輸層與 Socket API
# ==========================================
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# ==========================================
# 網路記憶體與緩衝區 (解鎖 Captive Portal 連線風暴限制)
# ==========================================
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_TCP_TIME_WAIT_DELAY=250
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# ==========================================
# 啟用網路管理 API (允許 Runtime 讀取並修改 MAC)
# ==========================================
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET_MGMT=y