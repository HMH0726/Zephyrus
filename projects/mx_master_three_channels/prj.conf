# Core
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_PRINTK=y
CONFIG_GPIO=y

# Bluetooth peripheral HID mouse
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_ID_MAX=3
CONFIG_BT_MAX_PAIRED=9
CONFIG_BT_DEVICE_NAME="MX Master CH1"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SECURITY_ERR_TO_STR=y
CONFIG_BT_SMP_ERR_TO_STR=y

# Persist three identities, bonds, CCC subscriptions, IRKs, etc.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT_SETTINGS=y

# Optional interactive control: mx status/channel/next/move/click/unpair
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Keep diagnostics simple on small boards.
CONFIG_LOG=n

