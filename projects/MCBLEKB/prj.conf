# ---------------------------------------------------------------------------
# Multi-Channel BLE Keyboard - prj.conf
# XIAO nRF52840 (Plus) + Zephyr
# ---------------------------------------------------------------------------

# --- GPIO (button + LED) ---
CONFIG_GPIO=y

# --- Bluetooth core ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BTSwitchIRK"

# Allow multiple local identities = multiple "channels".
# Must be >= NUM_CHANNELS used in main.c (id 0 is the default identity).
CONFIG_BT_ID_MAX=4

# Only one *logical* BLE link at a time (one channel connected at once),
# but we allocate 2 connection object slots. Connectable advertising
# preallocates a connection object, and the object from the just-ended
# link may not be fully recycled yet at the moment we immediately start
# advertising again inside the disconnected() callback - see
# bt_conn_cb.recycled in Zephyr's docs. With only 1 slot this causes
# bt_le_adv_start() to intermittently fail with -ENOMEM right after a
# channel switch. 2 slots gives enough headroom.
CONFIG_BT_MAX_CONN=2

# Bond storage slots. Increase if you pair many different remote devices
# across all channels combined (each channel x each remote device = 1 bond).
CONFIG_BT_MAX_PAIRED=8

# --- Security / bonding ---
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
# "Just Works" bonding, no passkey/display required. Change if you need
# MITM-protected pairing (then also register bt_conn_auth_cb callbacks).
CONFIG_BT_SMP_SC_PAIR_ONLY=n

# --- Persist bonds/keys across reboot ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_REBOOT=y

# --- GATT ---
CONFIG_BT_GATT_DYNAMIC_DB=y

# --- Device Information Service (optional but recommended by most hosts) ---
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y

# --- Battery Service (optional, remove if you don't report battery) ---
CONFIG_BT_BAS=y

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_PRINTK=y

# --- Stacks (BT + our callbacks can be stack-hungry, pad a bit) ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_HCI_TX_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
