            z-index: 1000; 
            display: flex; 
            justify-content: center;
            align-items: center;
        }

        .fixed-header h1 {
            margin: 0; 
            font-size: 24px;
            color: #4CAF50; 
        }

        .custom-font {
            font-family: 'CustomFont', sans-serif;
            color: #aaa; 
            font-size: 18px;
            letter-spacing: 1px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: calc(100vh - 80px); 
        }

        /* ================== */
        /* 上方網格區塊樣式   */
        /* ================== */
        .container {
            display: flex;
            width: 95%; 
            max-width: 450px; 
            border-top: 1px solid #000;
            border-left: 1px solid #000;
            margin-bottom: 20px; /* 與狀態列留點間距 */
        }

        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            flex: 2; 
        }

        .grid-1x2 {
            display: grid;
            grid-template-columns: 1fr;
            flex: 1; 
        }

        .box {
            aspect-ratio: 1 / 1; 
            padding: 0;
            margin: 0;
            outline: none;
            border: none; 
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            background-color: #f0f0f0; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-family: inherit; 
            color: #000; /* 確保按鈕字體為深色 */
            cursor: pointer; 
            transition: background-color 0.1s; 
        }

        .box:active {
            background-color: #d0d0d0;
        }

        /* ================== */
        /* 下方狀態列區塊樣式 */
        /* ================== */
        .display-panel {
            width: 95%;
            max-width: 450px;
            /* 已經移除 margin-bottom: 40px; 將間距控制權交給 .led-controls */
            border: 1px solid #000; 
            display: flex;
        }

        .display-label {
            background-color: #f0f0f0;
            padding: 15px 10px;
            border-right: 1px solid #000; 
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 120px; 
            text-align: center;
            color: #000; /* 強制在暗黑模式中標籤文字顯示為深色 */
        }

        .display-content {
            flex: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #e74c3c; 
            font-weight: bold;
            background-color: transparent; /* 顯示原本的 #222 暗黑底色 */
        }

        /* ================== */
        /* 綠燈控制按鈕區塊   */
        /* ================== */
        .led-controls {
            margin-top: 30px;    /* 調整與上方狀態列的距離 */
            margin-bottom: 10px; /* 調整與下方提示文字的距離 */
        }

        /* 原本按鈕樣式 */
        button {
            font-size: 24px;
            padding: 15px 40px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        /* 複寫網格按鈕的圓角邊界設定，確保與 grid 方格切齊 */
        .box {
            border-radius: 0;
            margin: 0;
        }

        .on-btn { background-color: #4CAF50; color: white; }
        .off-btn { background-color: #f44336; color: white; }
        .exit-btn { background-color: #555; color: white; font-size: 18px; padding: 10px 30px; margin-top: 10px; }
        .exit-btn:hover { background-color: #777; }
        
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; }

        .note { color: #aaa; font-size: 15px; margin-top: 20px; line-height: 1.5; }
        
        .footer {
            margin-top: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- === 固定在最上方的 Header === -->
    <div class="fixed-header">
        <h1>XIAO 控制面板</h1>
    </div>

    <!-- === 主要內容區塊 === -->
    <div class="main-content">
        
        <!-- 上方網格區 -->
        <div class="container">
            <div class="grid-3x3">
                <button class="box" onclick="showSelected('1')">1</button>
                <button class="box" onclick="showSelected('2')">2</button>
                <button class="box" onclick="showSelected('3')">3</button>
                <button class="box" onclick="showSelected('4')">4</button>
                <button class="box" onclick="showSelected('5')">5</button>
                <button class="box" onclick="showSelected('6')">6</button>
                <button class="box" onclick="showSelected('7')">7</button>
                <button class="box" onclick="showSelected('8')">8</button>
                <button class="box" onclick="showSelected('9')">9</button>
            </div>

            <div class="grid-1x2">
                <button class="box" onclick="showSelected('A')">A</button>
                <button class="box" onclick="showSelected('B')">B</button>
            </div>
        </div>

        <!-- 下方顯示區塊 -->
        <div class="display-panel">
            <div class="display-label">Selected<br>BUTTON</div>
            <div class="display-content" id="selected-display">--</div>
        </div>
        
        <!-- === 加入了 class="led-controls" === -->
        <!-- 原本的綠燈控制按鈕 -->
        <div class="led-controls">
            <button id="btnOn" class="on-btn" onclick="sendReq('/led/on')">打開綠燈</button>
            <button id="btnOff" class="off-btn" onclick="sendReq('/led/off')">關閉綠燈</button>
        </div>
        
		<!-- 離開按鈕 -->
        <button class="exit-btn" onclick="closeWindow()">Exit</button>
		
        <!-- 你的專屬簽名區塊 -->
        <div class="footer">
            © <span class="custom-font">ORESANJO</span> / <span class="custom-font">SHUNNN</span>
        </div>
        

    </div>

    <script>
        /* ================== */
        /* 網格按鈕的互動控制 */
        /* ================== */
        function showSelected(buttonName) {
            const displayElement = document.getElementById('selected-display');
            displayElement.textContent = buttonName;
        }

        /* ================== */
        /* 綠燈控制功能       */
        /* ================== */
        function sendReq(url) {
            let btns = document.querySelectorAll('.on-btn, .off-btn');
            btns.forEach(b => b.disabled = true);
            fetch(url).catch(err => console.log('微控制器忙碌中，忽略此錯誤'))
                .finally(() => setTimeout(() => btns.forEach(b => b.disabled = false), 100));
        }

        /* ================== */
        /* 離開視窗的功能     */
        /* ================== */
        function closeWindow() {
            fetch('/exit').then(() => {
                window.open('', '_self').close();
                setTimeout(() => {
                    document.body.innerHTML = `
                        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;">
                            <h2 style="color: #4CAF50;">安全關閉</h2>
                            <p style="color: #aaa;">設備網路卡已成功關閉並切換回純藍牙模式。<br>您可以安全地關閉此分頁了。</p>
                        </div>
                    `;
                }, 300);
            }).catch(err => console.log('關閉請求發送失敗'));
        }
    </script>
</body>
</html>
