# ==========================================
# 核心系統與硬體基礎設定
# ==========================================
CONFIG_GPIO=y
# 🚨 [移除重複]: 原本在網路和藍牙設定中各出現一次 CONFIG_GPIO=y，已刪除一個。

CONFIG_MAIN_STACK_SIZE=4096
# 🚨 [移除重複]: 原本在兩份設定中都要求主堆疊為 4096，已合併保留一個。

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ENTROPY_GENERATOR=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_REBOOT=y

# ==========================================
# 🚨 封殺隱形內鬼：完全關閉終端機與日誌 (維持純淨 USB)
# ==========================================
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

CONFIG_LOG=n
# 🚨 [衝突解決]: 你原本在藍牙實驗 B 中開啟了 CONFIG_LOG=y。
# 為了配合上方完全關閉 CONSOLE 的需求（避免生成多餘的 USB COM Port），
# 這裡強制將 LOG 設為 n，否則編譯或執行時會找不到輸出路徑而當機。

# CONFIG_BT_SMP_LOG_LEVEL_DBG=y
# 🚨 [連帶刪除]: 因為上方已經把整個系統的 LOG=n 關閉了，
# 這個藍牙 SMP 的子模組 debug 訊息也沒有意義了，所以直接移除，避免編譯報錯。

CONFIG_USB_CDC_ACM=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# ==========================================
# 🌐 USB 虛擬網卡與 TCP/IP 網路核心
# ==========================================
CONFIG_UDC_DRIVER=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# ==========================================
# 網路緩衝區擴展 (確保網頁伺服器不卡死)
# ==========================================
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_TCP_TIME_WAIT_DELAY=200
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# ==========================================
# 網路管理 API (允許動態修改 MAC)
# ==========================================
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET_MGMT=y

# ==========================================
# 💾 快閃記憶體與設定儲存 (藍牙配對紀錄需要)
# ==========================================
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# ==========================================
# 🦷 藍牙核心與連線設定
# ==========================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO_Mouse"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_ID_MAX=3
CONFIG_BT_RX_STACK_SIZE=4096

# CONFIG_BT_CTLR_RL_SIZE=8
# 🚨 [版本相容性移除]: 這個藍牙底層控制器 (Controller) 的設定，
# 在新版的 Zephyr (特別是使用 SoftDevice 或某些 Nordic 原生 BLE 協定層時)
# 通常由系統自動計算或被棄用。如果你後續編譯出現 BT_CTLR_RL_SIZE 未定義的警告，就是因為它，所以我先將它移除。

CONFIG_BT_EXT_ADV=n

# ==========================================
# 藍牙安全與配對機制 (SMP)
# ==========================================
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# ==========================================
# 藍牙設備資訊與外觀 (滑鼠)
# ==========================================
CONFIG_BT_DEVICE_APPEARANCE=962
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_MANUF="XIAO"
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x046D
CONFIG_BT_DIS_PNP_PID=0xB023
CONFIG_BT_DIS_PNP_VER=0x0100

# ==========================================
# 🎛️ QDEC 旋轉編碼器與感測器核心
# ==========================================
CONFIG_SENSOR=y
CONFIG_QDEC_NRFX=y

# 關閉電源管理，強制 nRF52840 高頻時脈 (HFCLK) 恆開，避免 QDEC 採樣休眠掉格
CONFIG_PM=n

CONFIG_NET_MAX_CONN=16