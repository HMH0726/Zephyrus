# ==========================================
# 藍牙基礎設定 (定義為一把鍵盤)
# ==========================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BTSwitchIRK"
CONFIG_BT_DEVICE_APPEARANCE=961

# ==========================================
# 藍牙安全與多重身份 (Multi-Identity) 核心設定
# ==========================================
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=1
# 允許同時記憶 3 組配對紀錄
CONFIG_BT_MAX_PAIRED=3   
# 原生開啟 3 組獨立的藍牙 MAC/IRK 身份
CONFIG_BT_ID_MAX=3       
CONFIG_BT_PRIVACY=y

# ==========================================
# NVS 非揮發性儲存 (確保斷電後不會忘記配對)
# ==========================================
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# ==========================================
# 硬體驅動
# ==========================================
CONFIG_GPIO=y

# ==========================================
# 啟用 USB 虛擬序列埠 (讓 printk 透過 Type-C 輸出)
# ==========================================
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_STACK_NEXT=n  
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# ==========================================
# 🌟 救命仙丹：加大系統記憶體與堆疊大小 🌟
# (避免同時啟用 USB, BT, Flash 導致開機記憶體爆表當機)
# ==========================================
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# ==========================================
# 專家建議：開啟藍牙底層 Debug 日誌 (防洗版精準模式)
# ==========================================
CONFIG_LOG=y
# 1. 加大 Log 緩衝區，避免文字遺失
CONFIG_LOG_BUFFER_SIZE=4096
# 2. 把全域藍牙日誌降級為一般資訊 (INF)，不要印底層封包
CONFIG_BT_LOG_LEVEL_INF=y
# 3. "只"針對配對(SMP)與金鑰(KEYS)開啟最高除錯模式 (DBG)
CONFIG_BT_SMP_LOG_LEVEL_DBG=y
CONFIG_BT_KEYS_LOG_LEVEL_DBG=y