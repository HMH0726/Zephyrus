# ==========================================
# ENC 基礎設定
# ==========================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ENC"

# 開啟 GPIO 驅動
CONFIG_GPIO=y
CONFIG_SENSOR=y

# --- 解決 USB 版本衝突 ---
# 關閉新世代 USB 堆疊 (避免與經典版打架)
CONFIG_USB_DEVICE_STACK_NEXT=n

# --- 開啟經典版 USB 設備與 Console ---
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# 關閉電源管理，強制 nRF52840 的高頻時鐘永遠運作，確保 QDEC 不會睡著
CONFIG_PM=n

# 將 USB 輸出緩衝區加大 8 倍，防止 printk 卡死程式迴圈
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096